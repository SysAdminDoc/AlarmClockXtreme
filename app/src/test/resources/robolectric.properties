# Robolectric 4.14.1 supports Android SDKs up to 35 (Vanilla Ice Cream); the app
# targets 36, so pin Robolectric-driven unit tests to 35 instead of letting the
# SDK picker default to targetSdkVersion (which throws
# "targetSdkVersion=36 > maxSdkVersion=35"). Bump this when Robolectric ships
# SDK 36 support.
sdk=35

name: Version line consistency

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-lint:
    name: README / metadata / Gradle versions must match
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Extract version strings from source-of-truth files
        id: extract
        # v1.13.11: Catch release-surface drift using tracked files only. Local
        # planning docs are intentionally ignored, so CI validates Gradle,
        # README, and F-Droid metadata versionName/versionCode anchors.
        run: |
          set -euo pipefail

          APP_VERSION=$(grep -E 'versionName = "[^"]+"' app/build.gradle.kts \
            | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          APP_CODE=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts \
            | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          WEAR_VERSION=$(grep -E 'versionName = "[^"]+"' wear/build.gradle.kts \
            | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          WEAR_CODE=$(grep -E 'versionCode = [0-9]+' wear/build.gradle.kts \
            | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          README_BADGE=$(grep -E 'shields\.io/badge/version-[0-9.]+-' README.md \
            | head -1 | sed -E 's/.*badge\/version-([0-9.]+)-.*/\1/')
          README_INSTALL=$(grep -E 'AlarmClockXtreme-v[0-9.]+-play\.apk' README.md \
            | head -1 | sed -E 's/.*AlarmClockXtreme-v([0-9.]+)-play\.apk.*/\1/')
          FDROID_VERSION=$(grep -E '^[[:space:]]*-?[[:space:]]*versionName: [0-9.]+' metadata/com.sysadmindoc.alarmclock.yml \
            | head -1 | awk '{print $NF}')
          FDROID_CODE=$(grep -E '^[[:space:]]*-?[[:space:]]*versionCode: [0-9]+' metadata/com.sysadmindoc.alarmclock.yml \
            | head -1 | awk '{print $NF}')
          FDROID_CURRENT_VERSION=$(grep -E '^CurrentVersion: [0-9.]+' metadata/com.sysadmindoc.alarmclock.yml \
            | head -1 | awk '{print $NF}')
          FDROID_CURRENT_CODE=$(grep -E '^CurrentVersionCode: [0-9]+' metadata/com.sysadmindoc.alarmclock.yml \
            | head -1 | awk '{print $NF}')
          FDROID_EN_VERSION=$(grep -E '^[[:space:]]*-?[[:space:]]*versionName: [0-9.]+' metadata/en-US/fdroid.yml \
            | head -1 | awk '{print $NF}')
          FDROID_EN_CODE=$(grep -E '^[[:space:]]*-?[[:space:]]*versionCode: [0-9]+' metadata/en-US/fdroid.yml \
            | head -1 | awk '{print $NF}')
          FDROID_EN_CURRENT_VERSION=$(grep -E '^CurrentVersion: [0-9.]+' metadata/en-US/fdroid.yml \
            | head -1 | awk '{print $NF}')
          FDROID_EN_CURRENT_CODE=$(grep -E '^CurrentVersionCode: [0-9]+' metadata/en-US/fdroid.yml \
            | head -1 | awk '{print $NF}')

          echo "app=$APP_VERSION"            | tee -a "$GITHUB_OUTPUT"
          echo "app_code=$APP_CODE"          | tee -a "$GITHUB_OUTPUT"
          echo "wear=$WEAR_VERSION"          | tee -a "$GITHUB_OUTPUT"
          echo "wear_code=$WEAR_CODE"        | tee -a "$GITHUB_OUTPUT"
          echo "readme_badge=$README_BADGE"  | tee -a "$GITHUB_OUTPUT"
          echo "readme_install=$README_INSTALL" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_version=$FDROID_VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_code=$FDROID_CODE" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_current_version=$FDROID_CURRENT_VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_current_code=$FDROID_CURRENT_CODE" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_en_version=$FDROID_EN_VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_en_code=$FDROID_EN_CODE" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_en_current_version=$FDROID_EN_CURRENT_VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "fdroid_en_current_code=$FDROID_EN_CURRENT_CODE" | tee -a "$GITHUB_OUTPUT"

      - name: Assert all version strings agree
        run: |
          set -euo pipefail
          declare -A versions=(
            [app/build.gradle.kts]="${{ steps.extract.outputs.app }}"
            [wear/build.gradle.kts]="${{ steps.extract.outputs.wear }}"
            [README.md_badge]="${{ steps.extract.outputs.readme_badge }}"
            [README.md_install]="${{ steps.extract.outputs.readme_install }}"
            [metadata/com.sysadmindoc.alarmclock.yml_versionName]="${{ steps.extract.outputs.fdroid_version }}"
            [metadata/com.sysadmindoc.alarmclock.yml_CurrentVersion]="${{ steps.extract.outputs.fdroid_current_version }}"
            [metadata/en-US/fdroid.yml_versionName]="${{ steps.extract.outputs.fdroid_en_version }}"
            [metadata/en-US/fdroid.yml_CurrentVersion]="${{ steps.extract.outputs.fdroid_en_current_version }}"
          )
          declare -A codes=(
            [app/build.gradle.kts]="${{ steps.extract.outputs.app_code }}"
            [wear/build.gradle.kts]="${{ steps.extract.outputs.wear_code }}"
            [metadata/com.sysadmindoc.alarmclock.yml_versionCode]="${{ steps.extract.outputs.fdroid_code }}"
            [metadata/com.sysadmindoc.alarmclock.yml_CurrentVersionCode]="${{ steps.extract.outputs.fdroid_current_code }}"
            [metadata/en-US/fdroid.yml_versionCode]="${{ steps.extract.outputs.fdroid_en_code }}"
            [metadata/en-US/fdroid.yml_CurrentVersionCode]="${{ steps.extract.outputs.fdroid_en_current_code }}"
          )

          fail=0
          target_version="${versions[app/build.gradle.kts]}"
          for source in "${!versions[@]}"; do
            actual="${versions[$source]}"
            if [ -z "$actual" ]; then
              echo "::error file=$source::Could not extract a version string from $source"
              fail=1
            elif [ "$actual" != "$target_version" ]; then
              echo "::error file=$source::$source reports v$actual but app/build.gradle.kts is v$target_version"
              fail=1
            else
              echo "ok: $source = v$actual"
            fi
          done

          target_code="${codes[app/build.gradle.kts]}"
          for source in "${!codes[@]}"; do
            actual="${codes[$source]}"
            if [ -z "$actual" ]; then
              echo "::error file=$source::Could not extract a versionCode from $source"
              fail=1
            elif [ "$actual" != "$target_code" ]; then
              echo "::error file=$source::$source reports versionCode $actual but app/build.gradle.kts is $target_code"
              fail=1
            else
              echo "ok: $source versionCode = $actual"
            fi
          done

          if [ $fail -ne 0 ]; then
            echo
            echo "Bump versionName + versionCode in BOTH app/build.gradle.kts AND wear/build.gradle.kts,"
            echo "then update the README badge, README adb-install snippet, and both metadata files."
            exit 1
          fi

      - name: Assert Room DB version in README matches AlarmDatabase.kt
        run: |
          set -euo pipefail

          db_version=$(grep -E 'version = [0-9]+' app/src/main/java/com/sysadmindoc/alarmclock/data/local/AlarmDatabase.kt \
            | head -1 | sed -E 's/.*version = ([0-9]+).*/\1/')
          readme_db=$(grep -oE 'Room DB v[0-9]+' README.md \
            | head -1 | sed -E 's/Room DB v//')

          if [ -z "$db_version" ]; then
            echo "::error file=AlarmDatabase.kt::Could not extract DB version from AlarmDatabase.kt"
            exit 1
          fi
          if [ -z "$readme_db" ]; then
            echo "::error file=README.md::Could not find 'Room DB vN' in README.md"
            exit 1
          fi
          if [ "$readme_db" != "$db_version" ]; then
            echo "::error file=README.md::README says Room DB v${readme_db} but AlarmDatabase.kt is version ${db_version}"
            exit 1
          fi
          echo "ok: Room DB version = v${db_version}"

      - name: Assert Android 17 local-network permission name
        run: |
          set -euo pipefail

          if ! grep -q 'android.permission.ACCESS_LOCAL_NETWORK' app/src/main/AndroidManifest.xml; then
            echo "::error file=app/src/main/AndroidManifest.xml::Manifest must declare android.permission.ACCESS_LOCAL_NETWORK for Android 17 LAN access"
            exit 1
          fi
          if grep -q 'android.permission.LOCAL_NETWORK' app/src/main/AndroidManifest.xml; then
            echo "::error file=app/src/main/AndroidManifest.xml::android.permission.LOCAL_NETWORK is stale; use ACCESS_LOCAL_NETWORK"
            exit 1
          fi
          if ! grep -q '`ACCESS_LOCAL_NETWORK`' README.md; then
            echo "::error file=README.md::README permissions table must document ACCESS_LOCAL_NETWORK"
            exit 1
          fi
          if grep -q '`LOCAL_NETWORK`' README.md; then
            echo "::error file=README.md::README still documents stale LOCAL_NETWORK"
            exit 1
          fi
          echo "ok: Android 17 local-network permission docs match manifest"

      - name: Assert app code does not link to ignored markdown
        run: |
          set -euo pipefail

          # Build the set of tracked .md files (only README.md by default).
          tracked_md=$(git ls-files -- '*.md' | sort)

          fail=0
          # Scan Kotlin/Java source for markdown file references.
          while IFS= read -r match; do
            file=$(echo "$match" | cut -d: -f1)
            line=$(echo "$match" | cut -d: -f2)
            content=$(echo "$match" | cut -d: -f3-)
            # Extract the referenced .md filename.
            ref=$(echo "$content" | grep -oE '[A-Za-z0-9_/-]+\.md' | head -1)
            if [ -z "$ref" ]; then continue; fi
            basename_ref=$(basename "$ref")
            # Check if the referenced file is tracked in git.
            if ! echo "$tracked_md" | grep -qF "$basename_ref"; then
              echo "::error file=$file,line=$line::$file:$line links to '$ref' which is gitignored — use README.md anchors for public links"
              fail=1
            fi
          done < <(grep -rnE '\.(md|MD)["'"'"')\]]' app/src/main/java/ --include='*.kt' --include='*.java' 2>/dev/null || true)

          if [ $fail -ne 0 ]; then
            echo "App source must not link to ignored markdown files."
            echo "Use README.md anchors or in-app copy for public-facing links."
            exit 1
          fi
          echo "ok: no app-code links to ignored markdown"

      - name: Assert no tag-only third-party GitHub Actions
        run: |
          set -euo pipefail

          fail=0
          for wf in .github/workflows/*.yml; do
            while IFS= read -r line; do
              action=$(echo "$line" | sed -E 's/.*uses: ([^[:space:]]+).*/\1/')
              if echo "$action" | grep -qE '^[^/]+/[^@]+@v[0-9]'; then
                echo "::error file=$wf::$action uses a mutable tag reference — pin to a full-length SHA"
                fail=1
              fi
            done < <(grep -E '^\s*uses:' "$wf" | grep -v '^#')
          done
          if [ $fail -ne 0 ]; then
            echo "All third-party actions must be pinned to immutable commit SHAs."
            exit 1
          fi
          echo "ok: all workflow actions are SHA-pinned"

      - name: Assert manifest permissions are documented in README
        run: |
          set -euo pipefail

          fail=0
          # Extract permission names from all manifests.
          for manifest in app/src/main/AndroidManifest.xml app/src/play/AndroidManifest.xml app/src/fdroid/AndroidManifest.xml; do
            [ -f "$manifest" ] || continue
            while IFS= read -r perm; do
              # Normalize: strip android.permission. prefix for README matching.
              short=$(echo "$perm" | sed 's/android\.permission\.//')
              if ! grep -qF "$short" README.md; then
                echo "::error file=$manifest::Permission '$perm' declared in $manifest but not documented in README.md permissions table"
                fail=1
              fi
            done < <(grep -oE 'android:name="([^"]+)"' "$manifest" \
              | sed -E 's/android:name="(.*)"/\1/' \
              | grep -E '^android\.permission' \
              | sort -u)
          done

          if [ $fail -ne 0 ]; then
            echo "Every declared permission must have a row in the README permissions table."
            exit 1
          fi
          echo "ok: all manifest permissions are documented in README"

AutoName: AlarmClockXtreme
Summary: Feature-rich alarm clock with challenges, weather, and bedtime tools

Description: |-
  AlarmClockXtreme is a privacy-first, open-source alarm clock designed to
  actually get you out of bed. Features include 30 dismiss challenges,
  exact alarms, weather and public-holiday context, calendar-assisted alarms,
  bedtime tools, timer, stopwatch, widgets, local statistics, and full
  backup/restore.

  No ads, no analytics, no tracking, no accounts required. The F-Droid flavor
  excludes the Play-only YouTube downloader, Wear OS Data Layer bridge,
  Health Connect SDK path, and ML Kit handwriting recognizer.
  Crash logs are capped local files in app-private storage, excluded from
  backups, and never uploaded automatically; they leave the device only if
  you explicitly export a support bundle.


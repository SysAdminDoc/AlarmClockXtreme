AutoName: AlarmClockXtreme
Summary: Alarm clock with 30 wake-up challenges and exact scheduling

Description: |-
  AlarmClockXtreme is an open-source Android alarm clock built for heavy
  sleepers and shift workers. It also suits people who want more control than
  the stock clock gives them. Exact scheduling handles the wake-up. Thirty
  dismiss challenges help make sure you stay awake.

  Set date-specific alarms, group routines into profiles, or use rotating
  shift patterns. Wake confirmation can ring again if you fall back asleep.
  Weather, sunrise timing, timers, bedtime tools, local statistics, widgets,
  and encrypted backups are included.
  Rotating shift patterns can gate alarms through DDNNO, 4-on-4-off, Panama,
  DuPont, and Pitman cycles entirely on device.

  No ads, no analytics, no tracking, and no account. The F-Droid flavor
  excludes the Play-only YouTube downloader, Wear OS Data Layer bridge,
  Health Connect SDK path, and ML Kit handwriting recognizer.
  Chronotype estimates store only five local preference answers and derive
  bedtime/wake timing on device.
  Pre-sleep factor tags store caffeine/exercise/alcohol/stress flags locally
  for 30 days and compare them with local restlessness summaries on device.
  Sonar sleep tracking stores compact movement and loud sleep-sound metadata
  locally for 30 days and never saves raw audio.
  Bedtime room-noise baselines store only a quiet/moderate/loud label plus
  timestamp, exclude that label from backup, and never save raw audio.
  Crash logs are capped local files in app-private storage, excluded from
  backups, and never uploaded automatically; they leave the device only if
  you explicitly export a support bundle.


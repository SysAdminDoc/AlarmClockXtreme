AntiFeatures:
  NonFreeNet:
    en-US: |-
      Optional features can contact third-party network services, including
      Open-Meteo weather and air quality, Nager.Date public holidays,
      api.weather.gov alerts, Windy radar, public RSS feeds, user-configured
      webhooks, internet radio streams, and a local Philips Hue bridge.
      Local crash logs do not use network access and are never uploaded by
      the app.


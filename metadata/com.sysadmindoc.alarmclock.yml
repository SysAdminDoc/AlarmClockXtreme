AutoName: AlarmClockXtreme
Summary: Feature-rich alarm clock with challenges, weather, and bedtime tools
Description: |-
  AlarmClockXtreme is an open-source alarm clock with exact scheduling,
  22 dismiss challenges, smart wake features, timers, stopwatch, weather,
  public-holiday skips, calendar-assisted alarms, bedtime tools, widgets,
  local statistics, and full backup/restore.

  No ads, no analytics, no tracking, and no accounts required. The F-Droid
  flavor excludes the Play-only YouTube downloader and Wear OS Data Layer
  bridge.


    <circle cx="170" cy="144" r="110" fill="#58A6FF" opacity="0.16" filter="url(#halo)"/>
    <circle cx="352" cy="360" r="84" fill="#4ADE80" opacity="0.12" filter="url(#halo)"/>
    <rect x="58" y="58" width="396" height="396" rx="96" fill="url(#panel)" stroke="#22324B" stroke-width="3"/>
    <path d="M106 124C140 97 181 82 223 78" stroke="#213959" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M326 90C377 114 410 157 426 209" stroke="#1B3F35" stroke-width="6" stroke-linecap="round" opacity="0.54"/>
    <g filter="url(#softGlow)">
      <circle cx="256" cy="266" r="122" fill="url(#dialFill)" stroke="url(#blueStroke)" stroke-width="28"/>
      <path d="M345 351A122 122 0 0 1 293 386" fill="none" stroke="url(#greenStroke)" stroke-width="28" stroke-linecap="round"/>
      <path d="M177 143Q152 108 176 88Q196 70 222 95" fill="none" stroke="url(#blueStroke)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M335 143Q360 108 336 88Q316 70 290 95" fill="none" stroke="url(#blueStroke)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M205 160L190 138" fill="none" stroke="url(#blueStroke)" stroke-width="14" stroke-linecap="round"/>
      <path d="M307 160L322 138" fill="none" stroke="url(#blueStroke)" stroke-width="14" stroke-linecap="round"/>
      <path d="M208 371L185 406" fill="none" stroke="url(#blueStroke)" stroke-width="16" stroke-linecap="round"/>
      <path d="M304 371L327 406" fill="none" stroke="url(#blueStroke)" stroke-width="16" stroke-linecap="round"/>
      <path d="M256 266V204" fill="none" stroke="url(#blueStroke)" stroke-width="22" stroke-linecap="round"/>
      <path d="M256 266L314 304" fill="none" stroke="url(#greenStroke)" stroke-width="24" stroke-linecap="round"/>
      <circle cx="256" cy="266" r="20" fill="#9DD1FF"/>
      <circle cx="256" cy="266" r="9" fill="#4ADE80"/>

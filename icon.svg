<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AlarmClockXtreme">
  <defs>
    <linearGradient id="bg" x1="64" y1="40" x2="440" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#0D1320"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>
    <linearGradient id="panel" x1="92" y1="76" x2="420" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171F31"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>
    <linearGradient id="blueStroke" x1="164" y1="126" x2="348" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8AC5FF"/>
      <stop offset="48%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#2E79EB"/>
    </linearGradient>
    <linearGradient id="greenStroke" x1="248" y1="262" x2="330" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6DF2A8"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <radialGradient id="dialFill" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#182235"/>
      <stop offset="72%" stop-color="#0A111D"/>
      <stop offset="100%" stop-color="#070D16"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip">
      <rect x="26" y="26" width="460" height="460" rx="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
